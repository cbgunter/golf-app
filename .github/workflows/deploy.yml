name: Deploy Golf App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  # ─── Deploy Infrastructure (only when changed) ─────────────────────────────
  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm install --prefer-offline

      - name: CDK Deploy
        working-directory: infrastructure
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Extract CDK outputs
        id: outputs
        working-directory: infrastructure
        run: |
          BUCKET=$(jq -r '.GolfAppStack.GolfAppFrontendBucket // empty' cdk-outputs.json)
          DIST_ID=$(jq -r '.GolfAppStack.GolfAppDistributionId // empty' cdk-outputs.json)
          echo "frontend_bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

  # ─── Build & Deploy Backend ─────────────────────────────────────────────────
  backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --prefer-offline

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Deploy to Lambda
        working-directory: backend
        run: |
          zip -j function.zip dist/index.js
          aws lambda update-function-code \
            --function-name golf-app-api \
            --zip-file fileb://function.zip \
            --region ${{ env.AWS_REGION }}

  # ─── Build & Deploy Frontend ─────────────────────────────────────────────────
  frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Get S3 bucket name
        id: bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GolfAppStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          echo "name=$BUCKET" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ steps.bucket.outputs.name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ steps.bucket.outputs.name }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name GolfAppStack \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"
